# Single source of truth for provider-status.md + index.html.
# Edit THIS file, then run: scripts/gen-status.py --offline   (or without --offline next to a live gateway)
#
# Fields:
#   kind           provider | infra
#   name           display name
#   state          live | wallet | blocked | down | unknown
#   detail         one-line human fact
#   last_verified  ISO-8601 UTC of the last time a human/probe confirmed `state`
#   source         manual | gateway /health/all  (gateway rows are overwritten on each live run)
#   probe          (optional) key in /health/all "results" that owns this row
#
# Flat "- key: value" blocks only — the generator's YAML parser is deliberately tiny.

